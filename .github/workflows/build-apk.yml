# Builds the APK on GitHub's servers — no Android Studio needed.
# Push this folder to a GitHub repo, open the "Actions" tab, pick the latest run,
# and download "RadioRelay-apk" at the bottom of the page.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RadioRelay-apk
          path: app/build/outputs/apk/debug/app-debug.apk
